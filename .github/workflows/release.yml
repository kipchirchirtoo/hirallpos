name: Release Hirall POS Desktop & Mobile Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirall-mobile-companion-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

  build-windows-exe:
    name: Build Windows Desktop .EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: desktop-app
        run: flutter pub get

      - name: Build Windows Desktop Release
        working-directory: desktop-app
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path desktop-app/build/windows/x64/runner/Release/* -DestinationPath hirall-pos-desktop-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirall-pos-desktop-windows-zip
          path: hirall-pos-desktop-windows-x64.zip

  build-linux-desktop:
    name: Build Linux Desktop App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        working-directory: desktop-app
        run: flutter pub get

      - name: Build Linux Desktop Release
        working-directory: desktop-app
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          cd desktop-app/build/linux/x64/release/bundle
          tar -czvf /tmp/hirall-pos-desktop-linux-x64.tar.gz .
          cp /tmp/hirall-pos-desktop-linux-x64.tar.gz $GITHUB_WORKSPACE/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hirall-pos-desktop-linux-tar
          path: hirall-pos-desktop-linux-x64.tar.gz

  create-github-release:
    name: Create GitHub Release & Attach Binaries
    needs: [build-android-apk, build-windows-exe, build-linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: hirall-mobile-companion-apk
          path: ./release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: hirall-pos-desktop-windows-zip
          path: ./release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: hirall-pos-desktop-linux-tar
          path: ./release-assets

      - name: Rename Files for Release
        run: |
          mv release-assets/app-release.apk release-assets/hirall-mobile-companion-v1.0.0.apk || true
          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Hirall POS & Mobile Companion ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/hirall-mobile-companion-v1.0.0.apk
            release-assets/hirall-pos-desktop-windows-x64.zip
            release-assets/hirall-pos-desktop-linux-x64.tar.gz
