name: hirall_pos
description: "Hirall POS - Multi-Org, Multi-Branch, Multi-Module Offline-First POS Platform"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Local SQLite & Offline Sync
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  powersync: ^1.6.0
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Networking & Auth
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  
  # UI, Icons, Typography & Printing
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.17
  barcode_widget: ^2.0.4
  printing: ^5.13.1
  pdf: ^3.10.8
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
